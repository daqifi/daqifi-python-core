divergences:
- id: DIV-001
  upstream_path: src/Daqifi.Core/Channel/
  downstream_path: daqifi/channels.py
  upstream_symbol: null
  downstream_symbol: null
  kind: behavioral
  rationale: 'Python port architecturally chooses to delegate scaling/calibration
    to the device firmware rather than recomputing client-side. This means C# tests
    like GetScaledValue_*, Constructor_*, Properties_*, ToString_ReturnsChannelName
    have NO Python equivalent and should not be ported. New C# AnalogChannel features
    that touch scaling math should also be classified as `divergent` on /portomatic-check
    until the Python architecture changes. '
  accepted_at: 2026-04-18
backlog:
- id: PORT-001
  upstream_symbol: Daqifi.Core.Channel.AnalogChannel.SetActiveSample
  blocker: 'Currently divergent. To port, Python would need a local data-sample cache
    + event mechanism. Defer until use case forces it. '
