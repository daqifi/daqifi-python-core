  - upstream: src/Daqifi.Core/Channel/AnalogChannel.cs
    downstream: daqifi/devices.py
    relation: divergent
    notes: null
    rationale: "C# AnalogChannel is a self-contained data model with local scaling/calibration math (GetScaledValue computes (raw / resolution * port_range * cal_m + cal_b) * internal_scale_m client-side). Python AnalogInputChannel is a thin SCPI wrapper with no scaling math — the device computes scaled values and the Python class delegates everything via send_query/send_set. There is no Python class with field-level parity to C# AnalogChannel and no plan to add one (the Python port is intentionally device-delegated). "
    last_synced_sha: null
