- upstream: src/Daqifi.Core/Device/Discovery/WiFiDeviceFinder.cs
  downstream: daqifi/device_finders.py
  relation: one_to_one
  notes: "Multi-NIC discovery ported per daqifi-core PR #179/#180 \u2014 WiFiDeviceFinder.discover()\
    \ enumerates real NICs (via daqifi._internal.nic.enumerate_real_nics, backed by\
    \ the ifaddr dep) and binds one UdpTransport per NIC, broadcasting on each NIC's\
    \ directed broadcast address. Falls back to single-socket wildcard discovery when\
    \ ifaddr is unavailable or returns no real NICs (#95)."
  rationale: null
  last_synced_sha: 26b19fe48e3191ccacdc90540f492043c0df6a4e
