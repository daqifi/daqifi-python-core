- upstream: src/Daqifi.Core/Communication/Transport/HidLibraryPlatform.cs
  downstream: daqifi/_internal/hid_enumerator.py
  relation: divergent
  notes: "C# file declares 4 internal types: `IHidPlatform` (interface), `IHidTransportDevice`\
    \ (interface), `HidTransportReadStatus` / `HidTransportReadResult` (value types),\
    \ and `HidLibraryPlatform` (the concrete HidSharp-backed impl). Python collapses\
    \ these into `daqifi/_internal/hid_enumerator.py`: `HidPlatform` (Protocol) plus\
    \ `HidApiPlatform` (concrete, backed by the Python `hid` library \u2014 the moral\
    \ equivalent of HidSharp). The transport-device abstraction is currently inlined\
    \ into `HidApiPlatform.read` / `.write` rather than exposed as a separate Protocol;\
    \ revisit if a second platform implementation lands."
  rationale: null
  last_synced_sha: 26b19fe48e3191ccacdc90540f492043c0df6a4e
