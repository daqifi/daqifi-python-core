- upstream: src/Daqifi.Core/Firmware/FirmwareUpdateService.cs
  downstream: daqifi/firmware/update_service.py
  relation: divergent
  notes: 'C# `FirmwareUpdateService : IFirmwareUpdateService, IDisposable` with async
    ``Task UpdateFirmwareAsync`` / ``Task UpdateWifiModuleAsync`` becomes the sync
    ``DefaultFirmwareUpdateService`` class (concrete impl of the existing ``FirmwareUpdateService``
    Protocol). Per-state timeouts use monotonic deadline polling instead of linked
    ``CancellationTokenSource`` pairs; cooperative cancellation is a ``threading.Event``.
    ``IFirmwareDownloadService`` is async upstream AND in this codebase, so the WiFi
    version-check call is bridged through ``asyncio.run`` to keep the orchestrator''s
    surface sync. ``IDisposable.Dispose`` -> ``close``.'
  rationale: null
  last_synced_sha: 26b19fe48e3191ccacdc90540f492043c0df6a4e
