  notes: "C# interface (nominal typing \u2014 implementers explicitly declare `: ISampleSource`)\
    \ \u2192 Python `typing.Protocol` (structural typing \u2014 type checkers accept\
    \ any duck-typed object without inheritance). `@runtime_checkable` lets callers\
    \ `isinstance()` against the protocol if they need a runtime guard."
  rationale: 'Python uses structural typing for interface-like contracts. `typing.Protocol`
    is the idiomatic equivalent of a C# interface: the same capability (a documented
    contract for sample-source backends), expressed through structural conformance
    rather than nominal inheritance. Type checkers (mypy, pyright) accept any duck-typed
    object that exposes the three methods, so the contract is enforceable without
    requiring callers to subclass.'
