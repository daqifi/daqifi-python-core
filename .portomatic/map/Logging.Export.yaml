  notes: "C# interface → Python documentation/typing-intent class. Python callers don't subclass; any duck-typed object that exposes `get_channels()` / `get_sample_count()` / `stream_samples()` works."
  rationale: "Python uses duck typing — explicit interfaces aren't idiomatic. The class exists so the docstring + method signatures document the expected shape, but `CsvExporter.export` accepts any object satisfying the protocol structurally without requiring inheritance. Same capability as the C# interface (a contract for sample-source backends), just expressed via the type's structural shape rather than via nominal inheritance."
