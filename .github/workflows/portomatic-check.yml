# portomatic upstream-drift watcher
#
# Runs `portomatic check` daily (and on demand) against the configured upstream
# repo. Opens a GitHub issue when actionable drift (semantic | api-shape |
# new-feature) is detected and no open issue already covers the current
# upstream HEAD sha.
#
# Required repo configuration:
#   Variables (Settings → Secrets and variables → Actions → Variables):
#     PORTOMATIC_UPSTREAM_REPO   e.g. "DAQiFi/daqifi-core"
#     PORTOMATIC_UPSTREAM_REF    optional, defaults to "main"
#     PORTOMATIC_BASELINE        optional, defaults to sync_state.last_synced or HEAD~10
#     PORTOMATIC_DOWNSTREAM_DIR  optional, defaults to "." (repo root)
#   Secrets (Settings → Secrets and variables → Actions → Secrets):
#     PORTOMATIC_READ_TOKEN      a token that can read the private
#                                daqifi/portomatic repo (read-only contents)
#
# Required permissions: issues:write, contents:read.

name: portomatic check

on:
  schedule:
    - cron: "0 8 * * *"   # daily at 08:00 UTC
  workflow_dispatch:
    inputs:
      baseline:
        description: "Upstream SHA/ref to diff against (overrides PORTOMATIC_BASELINE)."
        required: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        # Without the variable, actions/checkout would check out this repo as
        # the "upstream" and the check would compare it with itself.
        env:
          UPSTREAM_REPO: ${{ vars.PORTOMATIC_UPSTREAM_REPO }}
          HAS_READ_TOKEN: ${{ secrets.PORTOMATIC_READ_TOKEN != '' }}
        run: |
          if [ -z "$UPSTREAM_REPO" ]; then
            echo "::error::Repository variable PORTOMATIC_UPSTREAM_REPO is not set (e.g. daqifi/daqifi-core)."
            exit 1
          fi
          if [ "$HAS_READ_TOKEN" != "true" ]; then
            echo "::error::Secret PORTOMATIC_READ_TOKEN is not set; it is needed to install the private portomatic package."
            exit 1
          fi

      - name: Checkout downstream (this repo)
        uses: actions/checkout@v4
        with:
          path: downstream

      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.PORTOMATIC_UPSTREAM_REPO }}
          ref: ${{ vars.PORTOMATIC_UPSTREAM_REF || 'main' }}
          path: upstream
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install portomatic
        # portomatic is a private repo in the daqifi org. The workflow's
        # GITHUB_TOKEN can only read this repository, so cloning it failed
        # with "repository not found", and no access-policy setting changes
        # that. A separate read-only token is used instead.
        env:
          GH_TOKEN: ${{ secrets.PORTOMATIC_READ_TOKEN }}
        run: |
          pip install -U pip
          pip install "git+https://x-access-token:${GH_TOKEN}@github.com/daqifi/portomatic@main"

      # Values from ${{ }} expressions reach the scripts through env:, never
      # inline: an inlined value is pasted into the script text, and a " #"
      # in a plain YAML scalar even starts a comment (the skip step's echo
      # was cut to `echo "Issue` that way, failing every run that found the
      # issue already open). GITHUB_* values come from the runner's env.
      - name: Resolve baseline
        id: resolve
        env:
          REQUESTED_BASELINE: ${{ inputs.baseline || vars.PORTOMATIC_BASELINE || '' }}
          DOWNSTREAM_DIR: ${{ vars.PORTOMATIC_DOWNSTREAM_DIR || '.' }}
        run: |
          BASELINE="$REQUESTED_BASELINE"
          if [ -z "$BASELINE" ]; then
            STATE="downstream/$DOWNSTREAM_DIR/.portomatic/sync_state.yaml"
            if [ -f "$STATE" ]; then
              BASELINE=$(STATE="$STATE" python -c "import os, yaml; print(yaml.safe_load(open(os.environ['STATE'])).get('last_synced_upstream_sha') or '')")
            fi
          fi
          if [ -z "$BASELINE" ]; then
            BASELINE="HEAD~10"
          fi
          echo "baseline=$BASELINE" >> "$GITHUB_OUTPUT"
          echo "Using baseline: $BASELINE"

      - name: Run check
        id: check
        working-directory: downstream/${{ vars.PORTOMATIC_DOWNSTREAM_DIR || '.' }}
        env:
          BASELINE: ${{ steps.resolve.outputs.baseline }}
        run: |
          portomatic check \
            --upstream "$GITHUB_WORKSPACE/upstream" \
            --baseline "$BASELINE" \
            --json > /tmp/portomatic-output.txt
          cat /tmp/portomatic-output.txt
          # --json prints "wrote report/plan" lines before the JSON object.
          python - <<'PY'
          text = open("/tmp/portomatic-output.txt").read()
          open("/tmp/portomatic-summary.json", "w").write(text[text.index("{"):])
          PY

      - name: Parse summary
        id: summary
        env:
          DOWNSTREAM_DIR: ${{ vars.PORTOMATIC_DOWNSTREAM_DIR || '.' }}
        run: |
          ACTIONABLE=$(jq -r '.actionable' /tmp/portomatic-summary.json)
          UPSTREAM_SHA=$(jq -r '.upstream_sha' /tmp/portomatic-summary.json)
          REPORT=$(jq -r '.report_path' /tmp/portomatic-summary.json)
          ACTIONABLE_COUNT=$(jq -r '.actionable_count' /tmp/portomatic-summary.json)
          TOTAL=$(jq -r '.total' /tmp/portomatic-summary.json)
          echo "actionable=$ACTIONABLE" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          # Normalised: upload-artifact refuses a path containing "./".
          REPORT_PATH=$(python -c 'import os, sys; print(os.path.normpath(sys.argv[1]))' \
            "downstream/$DOWNSTREAM_DIR/$REPORT")
          echo "report=$REPORT_PATH" >> "$GITHUB_OUTPUT"
          echo "actionable_count=$ACTIONABLE_COUNT" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"

      - name: Upload the change report
        if: always() && steps.summary.outputs.report != ''
        uses: actions/upload-artifact@v4
        with:
          name: portomatic-change-report
          path: ${{ steps.summary.outputs.report }}
          if-no-files-found: ignore

      - name: Skip if no actionable drift
        if: steps.summary.outputs.actionable != 'true'
        env:
          TOTAL: ${{ steps.summary.outputs.total }}
        run: |
          echo "No actionable drift (semantic / api-shape / new-feature). Total file-touches: $TOTAL."

      - name: Check for existing issue for this upstream sha
        if: steps.summary.outputs.actionable == 'true'
        id: dedup
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ steps.summary.outputs.upstream_sha }}
        run: |
          SHA_SHORT=$(printf '%s' "$UPSTREAM_SHA" | cut -c1-7)
          TITLE="portomatic: upstream drift @ $SHA_SHORT"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "existing=$EXISTING" >> "$GITHUB_OUTPUT"

      - name: Open drift issue
        if: steps.summary.outputs.actionable == 'true' && steps.dedup.outputs.existing == ''
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIONABLE_COUNT: ${{ steps.summary.outputs.actionable_count }}
          TOTAL: ${{ steps.summary.outputs.total }}
          UPSTREAM_REPO: ${{ vars.PORTOMATIC_UPSTREAM_REPO }}
          UPSTREAM_SHA: ${{ steps.summary.outputs.upstream_sha }}
          BASELINE: ${{ steps.resolve.outputs.baseline }}
          REPORT: ${{ steps.summary.outputs.report }}
          TITLE: ${{ steps.dedup.outputs.title }}
        run: |
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          BODY=$(mktemp)
          {
            echo "**$ACTIONABLE_COUNT** actionable file-touch(es) of **$TOTAL** total."
            echo ""
            echo "Upstream: \`$UPSTREAM_REPO@$UPSTREAM_SHA\`"
            echo "Baseline: \`$BASELINE\`"
            echo ""
            # An issue body is capped at 65536 characters; a long drift report
            # (hundreds of file-touches) is cut and the full one is attached
            # to the run.
            head -c 50000 "$REPORT"
            if [ "$(wc -c < "$REPORT")" -gt 50000 ]; then
              echo ""
              echo ""
              echo "_Report truncated. Full report: the \`portomatic-change-report\` artifact of [this run]($RUN_URL)._"
            fi
            echo ""
            echo "---"
            echo "_Generated by portomatic-check on \`$GITHUB_SHA\`. To absorb: run \`/portomatic-plan\` then \`/portomatic-apply\` locally._"
          } > "$BODY"
          # --force: create the labels if missing, leave them as they are otherwise.
          gh label create portomatic --repo "$GITHUB_REPOSITORY" --force \
            --description "Upstream port tracking (portomatic)" >/dev/null
          gh label create upstream-drift --repo "$GITHUB_REPOSITORY" --force \
            --description "daqifi-core changes not yet ported" >/dev/null
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --label "portomatic,upstream-drift" \
            --body-file "$BODY"

      - name: Skip — issue already exists
        if: steps.summary.outputs.actionable == 'true' && steps.dedup.outputs.existing != ''
        env:
          EXISTING: ${{ steps.dedup.outputs.existing }}
          UPSTREAM_SHA: ${{ steps.summary.outputs.upstream_sha }}
        run: |
          echo "Issue #$EXISTING already covers upstream sha $UPSTREAM_SHA; not opening a duplicate."
